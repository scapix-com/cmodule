# On tag push (v<version>), create GitHub release with:
#   cmodule-<version>.tar.gz  sources (stable checksum, unlike GitHub generated archives)
#   cmodule.cmake             bootstrap file pinning that tarball by URL and SHA256
#
# Latest bootstrap: https://github.com/scapix-com/cmodule/releases/latest/download/cmodule.cmake

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -q "set(CMODULE_VERSION \"${VERSION}\"" CMakeLists.txt; then
            echo "::error::CMODULE_VERSION in CMakeLists.txt doesn't match tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build release assets
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="cmodule-${VERSION}/" -o "dist/cmodule-${VERSION}.tar.gz" "${GITHUB_REF_NAME}"
          SHA256=$(sha256sum "dist/cmodule-${VERSION}.tar.gz" | cut -d' ' -f1)
          cmake -DVERSION="${VERSION}" -DSHA256="${SHA256}" -DOUTPUT=dist/cmodule.cmake -P bootstrap/generate.cmake
          {
            echo "Download bootstrap file to your project (or upgrade existing one):"
            echo
            echo '```'
            echo "curl -L --create-dirs -o cmake/cmodule.cmake https://github.com/scapix-com/cmodule/releases/download/${GITHUB_REF_NAME}/cmodule.cmake"
            echo '```'
            echo
            echo "Bootstrap file:"
            echo
            echo '```cmake'
            cat dist/cmodule.cmake
            echo '```'
            echo
            echo "Documentation: https://www.scapix.com/cmodule"
          } > dist/notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/cmodule-${VERSION}.tar.gz" dist/cmodule.cmake \
            --title "cmodule ${VERSION}" --notes-file dist/notes.md
